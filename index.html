<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO • Live Processing</title><style>
:root{color-scheme:dark;--c:#65f5d0}*{box-sizing:border-box}body{margin:0;background:#030b10;color:var(--c);font-family:monospace;background-image:radial-gradient(ellipse at 50% 30%,#12333a80,transparent 65%)}header{padding:22px 3vw;border-bottom:1px solid #31615b;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:23px;letter-spacing:5px;margin:4px 0}small{color:#7da7a8;letter-spacing:2px}button,input,select{accent-color:var(--c)}button,select{background:#0c242a;color:var(--c);border:1px solid #3c706b;padding:9px;cursor:pointer}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}main{padding:20px 3vw;display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:16px;height:calc(100dvh - 150px);min-height:480px}.panel{border:1px solid #24514f;background:#061317c9;overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 0 35px #0a33374a}.title{padding:13px;background:#102a30;font-size:12px;letter-spacing:2px;border-bottom:1px solid #24514f}.log{overflow:hidden;padding:12px;flex:1;font-size:12px;line-height:1.7;overflow-wrap:anywhere}.line{animation:arrive .25s ease-out}.muted{color:#55908e}.bright{color:#d4fff3;text-shadow:0 0 9px #62ffd8}footer{padding:0 3vw 15px;color:#6b9395;font-size:11px;display:flex;justify-content:space-between}.meter{height:3px;background:#12312f;margin:5px 0 12px}.meter i{display:block;height:100%;background:var(--c);box-shadow:0 0 12px var(--c);transition:width .4s}#popup{position:fixed;left:50%;top:48%;transform:translate(-50%,-45%);width:min(620px,90vw);background:#06232af2;border:1px solid #7dffe0;padding:30px;box-shadow:0 0 80px #32f9c52b;pointer-events:none;opacity:0;transition:opacity .35s,transform .35s;z-index:5}#popup.show{opacity:1;transform:translate(-50%,-50%)}#message{font-size:clamp(25px,4vw,43px);color:#e2fff7;letter-spacing:2px;margin:18px 0}#source{color:#81b8b9;font-size:12px}#pulse{display:inline-block;width:8px;height:8px;background:#69ffd4;border-radius:50%;box-shadow:0 0 15px #69ffd4;margin-right:8px}@keyframes arrive{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}@media(max-width:800px){main{grid-template-columns:1fr 1fr;height:75dvh}.panel:last-child{display:none}h1{font-size:18px}nav{font-size:12px}}@media(prefers-reduced-motion:reduce){.line{animation:none}#popup{transition:none}}
</style><header><div><small><span id="pulse"></span>ECHO / GATEHOUSE NETWORK</small><h1>BACKGROUND OPERATIONS</h1><small>FICTIONAL TERMINAL SIMULATION</small></div><nav><label>Activity <input id="speed" type="range" min="1" max="10" value="6"></label><button id="pause">Pause</button><button id="incoming">Incoming message</button><button id="full">Full screen</button><button id="download">Save HTML</button></nav></header><main><section class="panel"><div class="title">01 / ARCHIVE PROCESSING</div><div class="log" id="a"></div></section><section class="panel"><div class="title">02 / INCOMING DATA + RESPONSES</div><div class="log" id="b"></div></section><section class="panel"><div class="title">03 / GATE TELEMETRY</div><div class="log" id="c"></div></section></main><div id="popup" role="status" aria-live="polite"><small>INCOMING TRANSMISSION</small><div id="message"></div><div id="source"></div></div><footer><span>VISUAL SIMULATION • NO REAL SECURITY OR HEALTH MONITORING</span><span id="count">0 PACKETS</span></footer><script>
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)];let paused=false,packets=0,last=0,nextMessage=1800,hideAt=0,serial=0;const messages=["HEALED","ANOTHER ONE’S HEALED","OKAY, SYSTEM’S YOURS","SECURITY’S YOURS NOW","INCOMING RESPONSE RECEIVED","GATE CONNECTION ESTABLISHED","ARCHIVE RESTORED","NEW SIGNAL INBOUND","RESTORATION COMPLETE","ANOTHER ONE’S HEALED","YOUR CONSOLE IS READY","MESSAGE RECEIVED — STANDING BY"];const sources=['ECHO RELAY 01','GATEHOUSE CONTROL','ARCHIVE CHANNEL','RESTORATION CHANNEL','DEEP SPACE RELAY'];function line(id,text,bright=false){const el=document.createElement('div');el.className='line '+(bright?'bright':'muted');el.textContent=text;const log=$(id);log.append(el);while(log.children.length>65)log.firstChild.remove();log.scrollTop=log.scrollHeight}function incoming(now=performance.now()){serial++;$('message').textContent=pick(messages);$('source').textContent=pick(sources)+' / TRANSMISSION '+String(serial).padStart(4,'0')+' / SIMULATED';$('popup').classList.add('show');hideAt=now+3000;nextMessage=now+5500+Math.random()*4500;line('b','► '+$('message').textContent,true)}function tick(now){if(!paused){const interval=190-Number($('speed').value)*17;if(now-last>interval){last=now;const stamp=new Date().toLocaleTimeString();for(let i=0;i<2;i++){packets++;line('a',stamp+' '+pick(['INDEXING','DECODING','RESTORING','VERIFYING','ASSEMBLING'])+' / ECHO-'+Math.floor(Math.random()*99999).toString(16).toUpperCase());line('b',pick(['RX DATA','RESPONSE','RELAY','SYNC','INBOUND'])+' :: '+Array.from({length:6},()=>Math.floor(Math.random()*65535).toString(16).padStart(4,'0')).join(' '),Math.random()>.88);line('c',pick(['GATE','ARCHIVE','RELAY','BUFFER'])+' '+Math.floor(Math.random()*24).toString().padStart(2,'0')+' / '+(Math.random()*100).toFixed(2)+'%');}if(packets%12===0){const meter=document.createElement('div');meter.className='meter';const bar=document.createElement('i');bar.style.width=(20+Math.random()*80)+'%';meter.append(bar);$('c').append(meter)}$('count').textContent=packets.toLocaleString()+' PACKETS'}if(now>nextMessage)incoming(now)}if(hideAt&&now>hideAt){$('popup').classList.remove('show');hideAt=0}requestAnimationFrame(tick)}$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause';if(paused){$('popup').classList.remove('show');hideAt=0}else nextMessage=performance.now()+1500};$('incoming').onclick=()=>incoming();$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){$('full').textContent='Use browser full screen'}};$('download').onclick=()=>{const clone=document.documentElement.cloneNode(true);for(const id of ['a','b','c'])clone.querySelector('#'+id).innerHTML='';clone.querySelector('#popup').className='';clone.querySelector('#pause').textContent='Pause';const blob=new Blob(['<!doctype html>'+clone.outerHTML],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ECHO-Processing-Terminal.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};for(let i=0;i<22;i++){line('a','BOOT / ARCHIVE PARTITION '+i+' READY');line('b','LISTENING / ECHO RELAY '+i);line('c','GATE '+i+' / SYNCHRONIZED')}requestAnimationFrame(tick);
</script></html>
